name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests: compile and run unit tests, no release.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and run unit tests
        run: |
          set -o pipefail
          ./gradlew assembleDebug testDebugUnitTest 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: grep -E "^e: |What went wrong|FAILED|Exception" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

  # Every commit on main: signed release APK + GitHub Release.
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # versionCode must grow with every release, or Android refuses the update.
      # The run number of this workflow only ever increases.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNING_KEYSTORE_BASE64 is missing. Releases must always be signed with the same key so they install as updates. See README > Release signing."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Run unit tests and build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest assembleRelease 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E "^e: |What went wrong|FAILED|Exception" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Verify APK signature and version
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          "$BUILD_TOOLS/aapt2" dump badging "$APK" | head -1
          cp "$APK" "MoFit-v${VERSION_NAME}.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" "MoFit-v${VERSION_NAME}.apk" \
            --target "$GITHUB_SHA" \
            --title "MoFit ${VERSION_NAME}" \
            --notes "Automatic release for commit ${GITHUB_SHA::7} (versionCode ${VERSION_CODE}).

          $(git log -1 --pretty=%B)"

      - uses: actions/upload-artifact@v4
        with:
          name: MoFit-v${{ env.VERSION_NAME }}
          path: MoFit-v${{ env.VERSION_NAME }}.apk

      - name: Clean up keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
